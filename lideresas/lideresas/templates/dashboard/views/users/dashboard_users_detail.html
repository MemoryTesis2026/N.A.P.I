{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block header %}
    <c-layout.admin.header />
{% endblock header %}
{% block content %}
    <main id="app">
        <div class="mt-6 flex justify-center items-center">
            <div>
                <h1 class="text-5xl font-extrabold text-[#6D929B]">Usuarios</h1>
                <h2 class="text-3xl font-extrabold text-gray-400">Listado</h2>
            </div>
        </div>
        <section class="max-w-5xl mx-auto flex flex-col items-center space-y-6">
            <div class="w-full lg:w-2/3 space-y-4 bg-white p-8 rounded-lg shadow-md">
                <div class="flex flex-col space-y-4">
                    <h3 class="text-xl font-extrabold text-gray-400">Información</h3>
                    <div class="flex flex-col space-y-2">
                        <div class="flex flex-row space-x-2">
                            <div class="flex flex-col">
                                <h4 class="text-xl font-extrabold text-gray-400">Nombre</h4>
                                <p class="text-xl font-extrabold text-gray-500">{{ object.username }}</p>
                            </div>
                            <div class="flex flex-col">
                                <h4 class="text-xl font-extrabold text-gray-400">Email</h4>
                                <p class="text-xl font-extrabold text-gray-500">{{ object.email }}</p>
                            </div>
                            <div class="flex flex-col">
                                <h4 class="text-xl font-extrabold text-gray-400">Fecha</h4>
                                <p class="text-xl font-extrabold text-gray-500">{{ object.date_joined }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="mt-4 max-w-5xl mx-auto flex flex-col items-center space-y-6">
            <div class="w-full lg:w-2/3 space-y-4 bg-white p-8 rounded-lg shadow-md">
                <h3 class="text-xl font-extrabold text-gray-400">Acciones</h3>
                <div class="flex flex-col space-y-2">
                    <a href="{% url 'dashboard:user-list' %}"
                       class="hover:scale-105 w-full px-8 py-3 text-white bg-[#ACD1E9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                        Volver
                    </a>
                    <a href="{% url 'dashboard:user-update' pk=object.pk %}"
                       class="hover:scale-105 w-full px-8 py-3 text-white bg-[#ACD1E9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                        Editar
                    </a>
                    <a href="{% url 'dashboard:user-delete' pk=object.pk %}"
                       class="hover:scale-105 w-full px-8 py-3 text-white bg-red-500 rounded-lg shadow-md hover:bg-red-700 transition-all duration-300">
                        Borrar
                    </a>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
