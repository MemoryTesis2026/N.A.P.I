{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block header %}
    <c-layout.admin.header />
{% endblock header %}
{% block content %}
    <main id="app">
        <div class="mt-8 flex justify-center items-center">
            <div>
                <h1 class="text-5xl font-extrabold text-[#6D929B]">{{ object.name }}</h1>
                <h2 class="text-3xl font-extrabold text-gray-400">Auditoría</h2>
            </div>
        </div>
        <section>
            <div class="w-full space-y-4 bg-white p-8 rounded-lg shadow-md">
                <div class="flex flex-col space-y-2">
                    <h3 class="text-xl font-extrabold text-gray-400">Información</h3>
                    <div class="flex flex-col space-y-2">
                        <div class="flex flex-row space-x-2">
                            <div class="flex flex-col">
                                <h4 class="text-xl font-extrabold text-gray-400">Tipo</h4>
                                <p class="text-xl font-extrabold text-gray-500">{{ object.audit_type.name }}</p>
                            </div>
                            <div class="flex flex-col">
                                <h4 class="text-xl font-extrabold text-gray-400">Fecha</h4>
                                <p class="text-xl font-extrabold text-gray-500">{{ object.created_at }}</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="max-w-5xl mx-auto flex flex-col items-center space-y-6">
            <div class="w-full space-y-4 bg-white p-8 rounded-lg shadow-md">
                <div class="flex flex-col space-y-2">
                    <a href="{% url 'dashboard:audit-list' %}"
                       class="hover:scale-105 w-full px-8 py-3 text-white bg-[#ACD1E9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                        Volver
                    </a>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
