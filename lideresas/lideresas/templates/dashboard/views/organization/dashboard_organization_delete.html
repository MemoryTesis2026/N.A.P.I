{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block header %}
    <c-layout.admin.header />
{% endblock header %}
{% block content %}
    <main id="app">
        <div class="mt-8 flex justify-center items-center">
            <div>
                <h1 class="text-5xl font-extrabold text-[#6D929B]">{{ object.name }}</h1>
                <h2 class="text-3xl font-extrabold text-gray-400">Organización</h2>
            </div>
        </div>
        <section class="max-w-5xl mx-auto flex flex-col items-center space-y-6">
            <div class="w-full space-y-4 bg-white p-8 rounded-lg shadow-md">
                <form method="post"
                      class="w-full space-y-4 bg-white p-8 rounded-lg shadow-md">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <button type="submit"
                            class="hover:scale-105 w-full px-8 py-3 text-white bg-red-500 rounded-lg shadow-md hover:bg-red-700 transition-all duration-300">
                        Borrar
                    </button>
                </form>
            </div>
            <div class="w-full space-y-4 bg-white p-8 rounded-lg shadow-md">
                <div class="flex flex-col space-y-2">
                    <a href="{% url 'dashboard:organization-list' %}"
                       class="hover:scale-105 w-full px-8 py-3 text-white bg-[#ACD1E9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                        Volver
                    </a>
                </div>
            </div>
        </section>
    </main>
{% endblock content %}
