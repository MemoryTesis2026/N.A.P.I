{% extends "base.html" %}

{% load static %}

{% block title %}
    User:
    {{ object.username }}
{% endblock title %}

{% block content %}
    <main id="app"
          class="min-h-screen bg-[#F5FAFA] px-6 py-12 sm:px-8 lg:px-10">
        <section class="max-w-5xl mx-auto space-y-6">
            <h1 class="text-5xl font-extrabold text-[#6D929B]">{{ object.username }}</h1>
            <p class="text-lg text-[#B7AFA3]">{{ object.name }}</p>
            <!-- Project Details -->
            <div class="bg-white p-8 rounded-lg shadow-md space-y-4">
                <div class="text-gray-900">
                    <strong>Correo:</strong> {{ object.email }}
                </div>
            </div>
            <!-- Back to Project List -->
            <a href="{% url 'users:update' %}"
               class="inline-block px-8 py-3 mt-6 text-white bg-[#ACD1E9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                Editar
            </a>
            <a href="{% url 'projects:project-list' %}"
               class="inline-block px-8 py-3 mt-6 text-white bg-[#ACD1E9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                Ver Proyectos
            </a>
            <a href="{% url 'organizations:organization-list' %}"
               class="inline-block px-8 py-3 mt-6 text-white bg-[#E8D0A9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                Ver Organizaciones
            </a>
        </section>
    </main>
{% endblock content %}
