{% extends "base.html" %}

{% load static %}
{% load crispy_forms_tags %}

{% block title %}
    User:
    {{ object.username }}
{% endblock title %}

{% block content %}
    <main id="app"
          class="min-h-screen bg-[#F5FAFA] px-6 py-12 sm:px-8 lg:px-10">
        <section class="max-w-5xl mx-auto space-y-6">
            <h1 class="text-5xl font-extrabold text-[#6D929B]">{{ object.username }}</h1>
            <p class="text-lg text-[#B7AFA3]">Usuario</p>
            <!-- Project Details -->
            <form method="post"
                  class="w-full lg:w-2/3 space-y-4 bg-white p-8 rounded-lg shadow-md">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit"
                        class="hover:scale-105 w-full px-8 py-3 text-white bg-[#ACD1E9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                    Actualizar
                </button>
                <c-buttons.normal_button type="button" class="mt-6 max-w-5xl mx-auto">
                <a href="{% url 'users:detail' username=object.username %}">Volver</a>
                </c-buttons.normal_button>
            </form>
        </section>
    </main>
{% endblock content %}
