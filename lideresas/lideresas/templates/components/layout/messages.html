{% if messages %}
    {% for message in messages %}
        <div x-data="{ open_{{ message.tags }}: true }" x-show="open_{{ message.tags }}" class="bg-indigo-600">
            <div class="max-w-screen-xl mx-auto px-4 py-3 text-white sm:text-center md:px-8">
                <p class="font-medium">
                    {{ message }}
                    <svg @click="open_{{ message.tags }} = !open_{{ message.tags }}" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="w-5 h-5">
                        <path fill-rule="evenodd" d="M5 10a.75.75 0 01.75-.75h6.638L10.23 7.29a.75.75 0 111.04-1.08l3.5 3.25a.75.75 0 010 1.08l-3.5 3.25a.75.75 0 11-1.04-1.08l2.158-1.96H5.75A.75.75 0 015 10z" clip-rule="evenodd" />
                    </svg>
                </p>
            </div>
        </div>
    {% endfor %}
{% endif %}
