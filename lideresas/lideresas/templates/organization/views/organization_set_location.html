{% extends "base.html" %}

{% load crispy_forms_tags %}


{% block content %}
    <main id="app"
          class="min-h-screen bg-[#F5FAFA] px-6 py-12 sm:px-8 lg:px-10">
        <section class="max-w-5xl mx-auto flex flex-col items-center space-y-6">
            <h1 class="text-5xl font-extrabold text-[#6D929B]">Title</h1>
            <h2 class="text-3xl font-extrabold text-gray-400">Text</h2>
            <form method="post"
                  class="w-full lg:w-2/3 space-y-4 bg-white p-8 rounded-lg shadow-md">
                {% csrf_token %}
                <div>{% include "locations/components/region_selector.html" only with regions=regions %}</div>
                <div>
                    <select id="province-selector" required></select>
                </div>
                {{ form.organization }}
                <select name="comuna" id="comunas-selector" required></select>
                <input type="text" name="street" value="" placeholder="calle..." required />
                <input type="number" name="number" value="" placeholder="1234" required />
                <button type="submit"
                        class="hover:scale-105 w-full px-8 py-3 text-white bg-[#ACD1E9] rounded-lg shadow-md hover:bg-[#6D929B] transition-all duration-300">
                    Añadir Ubicacion
                </button>
            </form>
        </section>
    </main>
{% endblock content %}
