name: CI Pipeline

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop, staging ]

jobs:
  test:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx ruff

      - name: Lint with ruff
        run: |
          # Valida sintaxis, errores críticos (E9, F63, F7, F82) e imports no definidos (F821)
          ruff check engine/ tests/ --select E9,F63,F7,F82,F821

      - name: Run test suite with pytest
        env:
          GEMINI_API_KEY: "mock_key_for_ci"
          SUPABASE_URL: "https://mock.supabase.co"
          SUPABASE_ANON_KEY: "mock_anon_key"
        run: |
          pytest tests/ -v
